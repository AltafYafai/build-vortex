name: Build GKI

on:
  workflow_call:
    inputs:
      TODO:
        type: string
      KSU:
        type: string
      KSU_SUSFS:
        type: string
      KSU_MANUAL_HOOK:
        type: string
      LAST_BUILD:
        type: string
      KERNEL_VERSION:
        type: string

  workflow_dispatch:
    inputs:
      TODO:
        description: |
          What to build:
            kernel   → Full kernel + AnyKernel3 zip (default)
            defconfig → Only dump .config and upload (for debug/review)
        default: "kernel"
        type: choice
        options:
          - "kernel"
          - "defconfig"

      KSU:
        description: |
          Root type:
            no        → Vanilla kernel, no root (VNL)
            kernelsu  → Official KernelSU (tiann) — latest main, kprobes, no SuSFS
            next      → KernelSU-Next — kprobes + manual hooks, SuSFS v2.1.0 ✅
        default: "next"
        type: choice
        options:
          - "no"
          - "kernelsu"
          - "next"

      KSU_SUSFS:
        description: |
          Include SuSFS (kernel-side root hiding)?
            true  → simonpunk/susfs4ksu v2.1.0 — only works with KSU=next ✅
            false → No SuSFS
          Note: Ignored when KSU=no or KSU=kernelsu
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

      KSU_MANUAL_HOOK:
        description: |
          Use Manual Hooks instead of kprobes? (KSU=next only)
            true  → Manual hooks (better detach/hide)
            false → kprobes (default)
          Note: Ignored for KSU=kernelsu (kprobes-only)
        default: "false"
        type: choice
        options:
          - "true"
          - "false"

      KERNEL_VERSION:
        description: |
          Target kernel version to build:
            5.10 → Xiaomi Redmi 12 5G (sky) — LineageOS 23.1 kernel
            6.1  → GKI Android 14 common kernel
            6.6  → GKI Android 15 common kernel
        default: "5.10"
        type: choice
        options:
          - "5.10"
          - "6.1"
          - "6.6"

env:
  MAN_DISABLE: true
  DEBIAN_FRONTEND: noninteractive

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90  # Full build (Thin LTO) takes ~40–60 min; 90 min gives headroom without silently hanging for 6 hours

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Determine Build Status
        run: |
          if [ "${{ toJson(github.event.inputs) }}" == "null" ]; then
            echo "STATUS=RELEASE" >> $GITHUB_ENV
            echo "TRIGGER=workflow_call" >> $GITHUB_ENV
          else
            echo "STATUS=BETA" >> $GITHUB_ENV
            echo "TRIGGER=workflow_dispatch" >> $GITHUB_ENV
          fi

      - name: Validate Inputs and Secrets
        env:
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }} # telegram chat id
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }} # telegram bot token
          GH_TOKEN: ${{ secrets.GH_TOKEN }} # github token
          KSU: ${{ inputs.KSU }}
          KSU_SUSFS: ${{ inputs.KSU_SUSFS }}
          KSU_MANUAL_HOOK: ${{ inputs.KSU_MANUAL_HOOK }}
        run: |
          _error() {
              echo "❌ ERROR: $*"
              let ret++
          }

          ret=0
          # Check Secrets
          if [[ -z "$TG_CHAT_ID" ]]; then
            _error "Missing TG_CHAT_ID secret (Telegram Chat ID)"
          fi
          if [[ -z "$TG_BOT_TOKEN" ]]; then
            _error "Missing TG_BOT_TOKEN secret (Telegram Bot Token)"
          fi
          if [[ -z "$GH_TOKEN" ]]; then
            _error "Missing GH_TOKEN secret (GitHub PAT)"
          fi

          # KernelSU Validation
          # Validate KSU value
          if [[ "$KSU" != "no" && "$KSU" != "kernelsu" && "$KSU" != "next" ]]; then
            _error "Invalid KSU value: '$KSU'. Valid options: no | kernelsu | next"
          fi
          # Cannot use SuSFS or Manual Hook without KernelSU
          if [[ $KSU == "no" && $KSU_SUSFS == "true" ]]; then
              _error "Cannot enable KSU_SUSFS=true when KSU=no"
          fi
          if [[ $KSU == "no" && $KSU_MANUAL_HOOK == "true" ]]; then
            _error "Cannot use KSU_MANUAL_HOOK=true when KSU=no"
          fi
          # tiann is kprobes-only, no SuSFS support — warn and continue
          if [[ $KSU == "kernelsu" && $KSU_MANUAL_HOOK == "true" ]]; then
              echo "⚠️  KSU_MANUAL_HOOK=true ignored for KSU=kernelsu (kprobes-only)"
          fi
          if [[ $KSU == "kernelsu" && $KSU_SUSFS == "true" ]]; then
              echo "⚠️  KSU_SUSFS=true ignored for KSU=kernelsu — tiann does not support SuSFS. Use KSU=next."
          fi

          if [[ $ret -gt 0 ]]; then
            exit $ret
          fi

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gh bc bison flex libssl-dev libelf-dev dwarves cpio
          pip install lxml

      - name: Maximise disk and create swap for Full LTO
        run: |
          # GitHub Actions ubuntu-latest: 7 GB RAM, ~30 GB free disk
          # Full LTO link on a 5.10 kernel needs ~14–18 GB RAM.
          # 7 GB RAM + 14 GB swap = 21 GB virtual — enough headroom for the linker.

          # -- Free up disk space (recovers ~20 GB) --
          sudo rm -rf /usr/local/lib/android \
                      /usr/local/share/boost \
                      /opt/ghc \
                      /opt/hostedtoolcache/CodeQL \
                      /usr/share/dotnet \
                      /usr/share/swift \
                      /usr/lib/jvm \
                      /usr/local/.ghcup \
                      /usr/local/share/powershell \
                      /usr/share/doc \
                      /usr/share/man || true

          # -- Create 14 GB swapfile (was 10 GB — bumped for Full LTO link) --
          # dd is universally safe; fallocate fails on some runner fs types.
          sudo swapoff -a || true
          sudo dd if=/dev/zero of=/mnt/swapfile bs=1M count=14336 status=progress
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile

          # Tune swappiness: use swap aggressively so LTO linker
          # doesn't get OOM-killed when it needs memory fast.
          sudo sysctl -w vm.swappiness=80

          echo "Swap enabled:"
          free -h

      - name: Run Build Script
        env:
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }} # telegram chat id
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }} # telegram bot token
          GH_TOKEN: ${{ secrets.GH_TOKEN }} # github token
          KSU: ${{ inputs.KSU }}
          KSU_SUSFS: ${{ inputs.KSU_SUSFS }}
          KSU_MANUAL_HOOK: ${{ inputs.KSU_MANUAL_HOOK }}
          LAST_BUILD: ${{ inputs.LAST_BUILD }}
          TODO: ${{ inputs.TODO }}
          KVER: ${{ inputs.KERNEL_VERSION }} # This passes the version to the script
        run: |
          export GIT_CLONE_PROTECTION_ACTIVE=false
          chmod +x *.sh py/*.py
          ./build.sh

      - name: Upload Artifacts (ZIP & IMG)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BASE_NAME }}-${{ github.run_number }}
          path: |
            artifacts/*.zip
            artifacts/*.img

      - name: Upload Artifacts (Info File)
        uses: actions/upload-artifact@v4
        with:
          name: info-${{ github.run_number }}
          path: artifacts/*.txt
